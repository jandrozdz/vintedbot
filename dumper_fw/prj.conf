CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="TrikiDumper"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_NUS=y
CONFIG_BT_ATT_PREPARE_COUNT=0
CONFIG_BT_GATT_CLIENT=n
CONFIG_HEAP_MEM_POOL_SIZE=256

# Minimal BLE buffers — nRF52810 has only 24 KB RAM
CONFIG_BT_BUF_ACL_TX_SIZE=27
CONFIG_BT_BUF_ACL_RX_SIZE=27
CONFIG_BT_L2CAP_TX_MTU=23

# Disable UART/serial/console entirely
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_LOG=n
CONFIG_PRINTK=n
